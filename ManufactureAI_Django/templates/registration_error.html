<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registration error</title><style>body{font-family:Arial;background:#f5f7fb;padding:40px}.card{background:white;padding:30px;border-radius:12px;max-width:650px;margin:auto}li{color:#b91c1c;margin:8px 0}a{color:#4338ca}</style></head><body><main class="card"><h2>Please correct the following details</h2><ul>{% for field, errors in form.errors.items %}{% for error in errors %}<li>{{ field }}: {{ error }}</li>{% endfor %}{% endfor %}</ul><p><a href="{% url 'webinar' %}#register">Return to the registration form</a></p></main></body></html>
