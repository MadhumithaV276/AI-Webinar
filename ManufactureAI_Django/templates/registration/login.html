<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin login</title><style>body{font-family:Arial;background:#f1f5f9;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:30px;border-radius:12px;width:min(360px,90vw);box-shadow:0 8px 30px #0001}input{width:100%;padding:11px;margin:8px 0 16px;box-sizing:border-box}button{background:#101b3f;color:white;padding:12px;border:0;border-radius:6px;width:100%}</style></head><body><form class="box" method="post">{% csrf_token %}<h2>Webinar Admin Login</h2>{% if form.errors %}<p style="color:#b91c1c">Invalid username or password.</p>{% endif %}<label>Username</label>{{ form.username }}<label>Password</label>{{ form.password }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Login</button></form></body></html>
