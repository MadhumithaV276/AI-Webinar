<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit registration</title><style>body{font-family:Arial;background:#f4f6fb;padding:30px}.box{max-width:650px;margin:auto;background:white;padding:28px;border-radius:12px}p{display:grid;gap:6px}input,select,textarea{padding:10px;border:1px solid #cbd5e1;border-radius:6px}button{background:#4338ca;color:white;padding:12px;border:0;border-radius:6px}</style></head><body><main class="box"><h2>Edit registration</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button>Save changes</button> <a href="{% url 'dashboard' %}">Cancel</a></form></main></body></html>
